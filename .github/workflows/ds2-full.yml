# Full DS2 -> .ipa pipeline. Put in .github/workflows/ds2-full.yml of a PRIVATE fork.
#
#   [ubuntu] codegen  Default.xex -> ARM64 C++   (no Mac needed)
#      |
#   [macOS ] build    C++ + MoltenVK -> Mach-O   (only step that needs Xcode)
#      |
#   [ubuntu] package  mkipa.py + zsign -> .ipa   (no Mac needed)
#
# Only 21 MB of game data ever enters CI: Default.xex from a PRIVATE release.
# The 8 GB of BDT/FSB data is copied to the phone later via Files, never to CI.
#
# macOS runner minutes are billed at a ~10x multiplier vs Linux, so packaging
# and signing deliberately run on ubuntu.

name: ds2-ios-full

on:
  workflow_dispatch:
    inputs:
      asset_release:
        description: "Private release tag holding Default.xex"
        required: false
        default: "ds2-private-assets"
        type: string
      do_sign:
        description: "Sign with P12_BASE64 / MOBILEPROVISION_BASE64 secrets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

env:
  GENERATED_DIR: app/generated/diag-dataonly
  APP_NAME: ds2

jobs:
  # ------------------------------------------------------------------ codegen
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Host toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang lld cmake wget gnupg \
            libvulkan-dev libzstd-dev libx11-dev libwayland-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxext-dev libxfixes-dev libxcursor-dev libxi-dev \
            libx11-xcb-dev libwayland-client0 libwayland-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libice-dev libsm-dev libxkbfile-dev \
            libasound2-dev libdbus-1-dev libudev-dev
          # ReXGlue is C++23 (std::expected); Ubuntu 24.04's clang 18 is too old.
          # app/CMakeLists.txt documents clang-20 as the supported host compiler.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20 all 2>&1 | tail -3
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-20/bin/clang 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-20/bin/clang++ 100
          clang++ --version | head -1

      - name: Cache ReXGlue third-party sources
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: sdk/thirdparty
          key: rexglue-thirdparty-${{ hashFiles('tools/fetch_thirdparty.py') }}-v1

      - name: Fetch ReXGlue SDK third-party sources
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: python3 tools/fetch_thirdparty.py

      - name: Make SDL3 a real git repo (its CMake calls git_describe)
        run: |
          D=sdk/thirdparty/sdl3
          if [ -f "$D/.git" ]; then
            rm -f "$D/.git"
            git -C "$D" init -q
            git -C "$D" add -A
            git -C "$D" -c user.name=ci -c user.email=ci@local commit -q -m vendored
            git -C "$D" tag -f v1.0.0
            echo "sdl3: real git repo with tag v1.0.0"
          else
            echo "sdl3: already a git repo"
          fi

      - name: Fetch Default.xex from a PRIVATE release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.asset_release }}
        run: |
          mkdir -p assets/game_root
          gh release download "$TAG" --pattern 'Default.xex' \
             --dir assets/game_root --repo "$GITHUB_REPOSITORY" --clobber
          test -s assets/game_root/Default.xex
          echo "Default.xex $(stat -c%s assets/game_root/Default.xex) bytes"
          # If codegen asks for more of game_root, add those small files to the
          # same private release (see ios_port/ci/PRIVATE_ASSETS.md).

      - name: Build the rexglue codegen CLI (SDK only, no game code needed)
        run: |
          cmake -S sdk -B out/sdk-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_FLAGS=-march=x86-64-v3 -DCMAKE_CXX_FLAGS=-march=x86-64-v3 \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_ENABLE_SANITIZERS=OFF \
            -DSDL_X11_XTEST=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DSDL_VIDEO_DRIVER_X11=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_DUMMYVIDEO=ON -DSDL_DUMMYAUDIO=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_JACK=OFF \
            -DSDL_PIPEWIRE=OFF -DSDL_SNDIO=OFF
          cmake --build out/sdk-host --target rexglue -j4
          ls -la sdk/out/linux-amd64/rexglue

      - name: Run static recompilation PowerPC -> ARM64 C++
        run: |
          mkdir -p out/logs
          sdk/out/linux-amd64/rexglue --log-level info \
            --log-file out/logs/codegen.log \
            codegen app/ds2_manifest.diag-dataonly.toml
          test -f "$GENERATED_DIR/sources.cmake"
          echo "generated C++ files: $(find "$GENERATED_DIR" -type f | wc -l)"
          du -sh "$GENERATED_DIR"
        # NOTE: the diagnostic manifest is what app/CMakeLists.txt defaults to
        # and is the one that passes validation. RC97 optimisations
        # (directas_ds2.py / novolatile.py / cr_as_local) are a later pass.

      - name: Upload generated code (PRIVATE artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ds2-generated
          path: ${{ env.GENERATED_DIR }}
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------- build
  build:
    needs: codegen
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          brew install cmake ninja python@3.12 || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -showsdks | grep iphoneos

      - name: Cache ReXGlue third-party sources
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: sdk/thirdparty
          key: rexglue-thirdparty-${{ hashFiles('tools/fetch_thirdparty.py') }}-v1

      - name: Fetch ReXGlue SDK third-party sources
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: python3 tools/fetch_thirdparty.py

      - name: Fetch generated code
        uses: actions/download-artifact@v4
        with:
          name: ds2-generated
          path: ${{ env.GENERATED_DIR }}

      - name: Re-apply iOS patches (idempotent)
        run: python3 ios_port/tools/apply_ios_patches.py . | tail -3

      - name: MoltenVK iOS xcframework
        run: |
          curl -L --fail -o /tmp/MoltenVK.zip \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.2.11/MoltenVK-all.zip"
          unzip -q /tmp/MoltenVK.zip -d /tmp/moltenvk
          XCFW="$(find /tmp/moltenvk -name MoltenVK.xcframework -maxdepth 6 | head -1)"
          test -n "$XCFW"
          echo "MOLTENVK_XCFW=$XCFW" >> "$GITHUB_ENV"

      - name: Configure iOS
        run: |
          cmake -S app -B out/app-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios_port/cmake/ios-arm64.cmake" \
            -DDS2_GENERATED_DIR="$GITHUB_WORKSPACE/$GENERATED_DIR" \
            -DREXGLUE_PLATFORM_IOS=ON \
            -DREXGLUE_IOS_MOLTENVK="$MOLTENVK_XCFW/ios-arm64/libMoltenVK.a" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDS2_PGO=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/ios_port/include"

      - name: Build Mach-O
        run: |
          cmake --build out/app-ios --config Release --target ds2 -- -jobs 4
          find out/app-ios -name ds2 -type f -perm -111 -exec ls -la {} \;

      - name: Upload Mach-O
        uses: actions/upload-artifact@v4
        with:
          name: ds2-macho
          path: |
            out/app-ios/**/ds2
            !out/app-ios/**/*.dSYM/**
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ package
  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Mach-O
        uses: actions/download-artifact@v4
        with:
          name: ds2-macho
          path: build/in

      - name: Locate executable
        run: |
          EXE="$(find build/in -name ds2 -type f | head -1)"
          test -n "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - name: Build .ipa with our own packer (no Xcode here)
        # The 501 MiB shader pack is NOT bundled: it is copied to the phone's
        # Documents via Files together with game_root/. The patched
        # ResolveShaderLibrary() looks for it there. This keeps the .ipa small
        # and avoids a slow 501 MB upload to GitHub on every run.
        run: |
          python3 ios_port/tools/mkipa.py \
            --executable "$EXE" \
            --plist ios_port/Info.plist \
            --resource ios_port/out/ds2_ios.toml \
            --out ds2-ios.ipa \
            --bundle-id com.yourteam.ds2ios
          python3 ios_port/tools/mkipa.py --verify ds2-ios.ipa

      - name: Sign with the developer's own certificate
        if: ${{ inputs.do_sign }}
        env:
          P12: ${{ secrets.P12_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          MP: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$P12" | base64 -d > /tmp/cert.p12
          echo "$MP" | base64 -d > /tmp/profile.mobileprovision
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign && mkdir build && cd build && cmake .. && make -j4
          sudo cp zsign /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          zsign -k /tmp/cert.p12 -p "$P12_PASS" -m /tmp/profile.mobileprovision \
                -o ds2-ios-signed.ipa ds2-ios.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ds2-ios-ipa
          path: |
            ds2-ios.ipa
            ds2-ios-signed.ipa
          if-no-files-found: ignore
          retention-days: 7

# KNOWN INTEGRATION ITEMS (will surface on the first build):
#  - iOS app delegate / UIKit UI loop + CAMetalLayer + CADisplayLink is not
#    written yet; the current app/src/main.cpp starts the host/PC loop.
#  - iOS input driver, audio system and VFS path remap (see TOUCH_CONTROLS.md).
#  - REXGLUE_IOS_MOLTENVK / zlib / frameworks link flags (see patch set).
# GPL-3.0 + third-party game assets => personal sideload only.
