# Full DS2 -> .ipa pipeline. Put in .github/workflows/ds2-full.yml of a PRIVATE fork.
#
#   [ubuntu] codegen  Default.xex -> ARM64 C++   (no Mac needed)
#      |
#   [macOS ] build    C++ + MoltenVK -> Mach-O   (only step that needs Xcode)
#      |
#   [ubuntu] package  mkipa.py + zsign -> .ipa   (no Mac needed)
#
# Only 21 MB of game data ever enters CI: Default.xex from a PRIVATE release.
# The 8 GB of BDT/FSB data is copied to the phone later via Files, never to CI.
#
# macOS runner minutes are billed at a ~10x multiplier vs Linux, so packaging
# and signing deliberately run on ubuntu.

name: ds2-ios-full

on:
  workflow_dispatch:
    inputs:
      asset_release:
        description: "Private release tag holding Default.xex"
        required: false
        default: "ds2-private-assets"
        type: string
      do_sign:
        description: "Sign with P12_BASE64 / MOBILEPROVISION_BASE64 secrets"
        required: false
        default: false
        type: boolean
      force_codegen:
        description: "Re-run PowerPC -> ARM64 codegen even if the generated C++ is cached"
        required: false
        default: false
        type: boolean
      reuse_run_id:
        description: "Optional: reuse the ds2-generated artifact from an earlier run id (fast iteration)"
        required: false
        default: ""
        type: string
      force_configure:
        description: "Re-run the 3-minute iOS CMake configure even if the Xcode project is cached"
        required: false
        default: false
        type: boolean
      use_ccache:
        description: "Compile through ccache (huge speedup; disable only if a build breaks)"
        required: false
        default: true
        type: boolean

# A new push supersedes an older run: never burn macOS minutes on stale builds.
concurrency:
  group: ds2-ios-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  GENERATED_DIR: app/generated/diag-dataonly
  APP_NAME: ds2

jobs:
  # ------------------------------------------------------------------ codegen
  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The XEX never changes. Generated ARM64 C++ is a pure function of the
      # XEX + the codegen tool, so a cache hit skips ~10 min of CLI build and
      # static recompilation. Bump v3 (or run with force_codegen=true) to
      # intentionally regenerate.
      - name: Cache generated ARM64 C++
        id: cache-generated
        uses: actions/cache@v4
        with:
          path: ${{ env.GENERATED_DIR }}
          key: ds2-generated-v3-${{ hashFiles('app/ds2_manifest.diag-dataonly.toml', 'sdk/src/rexglue/**', 'sdk/src/codegen/**') }}
          restore-keys: |
            ds2-generated-v3-

      # Fast iteration: reuse the generated ARM64 C++ from the last run instead
      # of spending 10 minutes rebuilding the codegen CLI on every compile fix.
      - name: Reuse generated code from an earlier run
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          gh run download "$RUN_ID" -n ds2-generated \
            -D "$GENERATED_DIR" --repo "$GITHUB_REPOSITORY"
          if [ -f "$GENERATED_DIR/ds2-generated/sources.cmake" ]; then
            mv "$GENERATED_DIR"/ds2-generated/* "$GENERATED_DIR"/
            rmdir "$GENERATED_DIR/ds2-generated"
          fi
          test -f "$GENERATED_DIR/sources.cmake"

      - name: Cache clang-20 toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: /usr/lib/llvm-20
          key: llvm-20-noble-${{ runner.os }}-v1

      - name: Host toolchain
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang lld cmake wget gnupg \
            libvulkan-dev libzstd-dev libx11-dev libwayland-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxext-dev libxfixes-dev libxcursor-dev libxi-dev \
            libx11-xcb-dev libwayland-client0 libwayland-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libice-dev libsm-dev libxkbfile-dev \
            libasound2-dev libdbus-1-dev libudev-dev
          # ReXGlue is C++23 (std::expected); Ubuntu 24.04's clang 18 is too old.
          # app/CMakeLists.txt documents clang-20 as the supported host compiler.
          if [ ! -x /usr/lib/llvm-20/bin/clang++ ]; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 20 2>&1 | tail -3
          else
            echo "clang-20 restored from cache"
          fi
          sudo update-alternatives --install /usr/bin/clang clang /usr/lib/llvm-20/bin/clang 100 >/dev/null
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/lib/llvm-20/bin/clang++ 100 >/dev/null
          clang++ --version | head -1

      - name: Cache ReXGlue third-party sources
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: sdk/thirdparty
          key: rexglue-thirdparty-${{ hashFiles('tools/fetch_thirdparty.py') }}-v1

      - name: Fetch ReXGlue SDK third-party sources
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') && steps.cache-thirdparty.outputs.cache-hit != 'true' }}
        run: python3 tools/fetch_thirdparty.py

      - name: Make SDL3 a real git repo (its CMake calls git_describe)
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') }}
        run: |
          D=sdk/thirdparty/sdl3
          if [ -f "$D/.git" ]; then
            rm -f "$D/.git"
            git -C "$D" init -q
            git -C "$D" add -A
            git -C "$D" -c user.name=ci -c user.email=ci@local commit -q -m vendored
            git -C "$D" tag -f v1.0.0
            echo "sdl3: real git repo with tag v1.0.0"
          else
            echo "sdl3: already a git repo"
          fi

      - name: Fetch Default.xex from a PRIVATE release
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.asset_release }}
        run: |
          mkdir -p assets/game_root
          gh release download "$TAG" --pattern 'Default.xex' \
             --dir assets/game_root --repo "$GITHUB_REPOSITORY" --clobber
          test -s assets/game_root/Default.xex
          echo "Default.xex $(stat -c%s assets/game_root/Default.xex) bytes"
          # If codegen asks for more of game_root, add those small files to the
          # same private release (see ios_port/ci/PRIVATE_ASSETS.md).

      # Incremental rebuilds: ninja only recompiles what changed between runs.
      - name: Cache codegen build tree
        uses: actions/cache@v4
        with:
          path: |
            out/sdk-host
            sdk/out
          key: rexglue-build-linux-v1
          restore-keys: |
            rexglue-build-linux-

      - name: Build the rexglue codegen CLI (SDK only, no game code needed)
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') }}
        run: |
          cmake -S sdk -B out/sdk-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_FLAGS=-march=x86-64-v3 -DCMAKE_CXX_FLAGS=-march=x86-64-v3 \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_ENABLE_SANITIZERS=OFF \
            -DSDL_X11_XTEST=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DSDL_VIDEO_DRIVER_X11=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_DUMMYVIDEO=ON -DSDL_DUMMYAUDIO=ON \
            -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF -DSDL_JACK=OFF \
            -DSDL_PIPEWIRE=OFF -DSDL_SNDIO=OFF
          cmake --build out/sdk-host --target rexglue -j4
          ls -la sdk/out/linux-amd64/rexglue

      - name: Run static recompilation PowerPC -> ARM64 C++
        if: ${{ inputs.reuse_run_id == '' && (inputs.force_codegen || steps.cache-generated.outputs.cache-hit != 'true') }}
        run: |
          mkdir -p out/logs
          sdk/out/linux-amd64/rexglue --log-level info \
            --log-file out/logs/codegen.log \
            codegen app/ds2_manifest.diag-dataonly.toml
          test -f "$GENERATED_DIR/sources.cmake"
          echo "generated C++ files: $(find "$GENERATED_DIR" -type f | wc -l)"
          du -sh "$GENERATED_DIR"
        # NOTE: the diagnostic manifest is what app/CMakeLists.txt defaults to
        # and is the one that passes validation. RC97 optimisations
        # (directas_ds2.py / novolatile.py / cr_as_local) are a later pass.

      - name: Verify generated code
        run: |
          test -f "$GENERATED_DIR/sources.cmake"
          echo "generated C++ files: $(find "$GENERATED_DIR" -type f | wc -l)"
          du -sh "$GENERATED_DIR"

      - name: Upload generated code (PRIVATE artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ds2-generated
          path: ${{ env.GENERATED_DIR }}
          retention-days: 7
          if-no-files-found: error

  # -------------------------------------------------------------------- build
  build:
    needs: codegen
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The generated code is 354 MB / 338 translation units (~30 min on a
      # macOS runner). Each run gets a UNIQUE save key but restores the newest
      # cache with the same prefix, so object files survive between iterations.
      # GitHub evicts the oldest caches automatically at the 10 GB repo limit.
      - name: Restore iOS Xcode project and objects
        id: cache-ios-tree
        uses: actions/cache/restore@v4
        with:
          path: out/app-ios
          key: ds2-ios-tree-v2-${{ github.run_id }}
          restore-keys: |
            ds2-ios-tree-v2-
            ds2-ios-tree-v1-

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-v1-${{ github.run_id }}
          restore-keys: |
            ccache-ios-v1-

      - name: Xcode
        run: |
          brew install cmake ninja python@3.12 ccache || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -showsdks | grep iphoneos

      - name: Cache ReXGlue third-party sources
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: sdk/thirdparty
          key: rexglue-thirdparty-${{ hashFiles('tools/fetch_thirdparty.py') }}-v1

      - name: Fetch ReXGlue SDK third-party sources
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: python3 tools/fetch_thirdparty.py

      - name: Fetch generated code
        uses: actions/download-artifact@v4
        with:
          name: ds2-generated
          path: ${{ env.GENERATED_DIR }}

      - name: Re-apply iOS patches (idempotent)
        run: python3 ios_port/tools/apply_ios_patches.py . | tail -3

      - name: Cache MoltenVK iOS static library
        id: cache-moltenvk
        uses: actions/cache@v4
        with:
          path: /tmp/moltenvk
          key: moltenvk-ios-v1.4.2-v1

      - name: MoltenVK iOS static library
        run: |
          # The tar holds BOTH dynamic/ and static/ xcframeworks; `find | head -1`
          # used to pick dynamic/, whose ios-arm64 slice has no libMoltenVK.a.
          # Stage one canonical, deterministic path for CMake and the linker.
          LIB=/tmp/moltenvk/libMoltenVK.a
          INC=/tmp/moltenvk/include
          if [ ! -f "$LIB" ] || [ ! -d "$INC" ]; then
            curl -L --fail -o /tmp/MoltenVK-ios.tar \
              "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar"
            mkdir -p /tmp/moltenvk/extract
            tar -xf /tmp/MoltenVK-ios.tar -C /tmp/moltenvk/extract
            cp /tmp/moltenvk/extract/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a "$LIB"
            rm -rf "$INC"
            cp -R /tmp/moltenvk/extract/MoltenVK/MoltenVK/include "$INC"
          else
            echo "MoltenVK restored from cache"
          fi
          test -f "$LIB"
          test -f "$INC/vulkan/vulkan.h"
          echo "MOLTENVK_LIB=$LIB" >> "$GITHUB_ENV"
          echo "MOLTENVK_INCLUDE=$INC" >> "$GITHUB_ENV"

      - name: Detect CMake inputs changed
        id: cmake-inputs
        run: |
          # The cached Xcode project cannot see NEW source files added to
          # CMakeLists.txt (ZERO_CHECK is defeated by the mtime pinning), so
          # reconfigure whenever any CMake input file content changes.
          HASH=$(find app sdk ios_port -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' \) \
                  -not -path '*/out/*' -print0 | sort -z | xargs -0 shasum -a 256 \
                  | shasum -a 256 | awk '{print $1}')
          echo "CMAKE_INPUTS_HASH=$HASH" >> "$GITHUB_ENV"
          if [ -f out/app-ios/.cmake_inputs_hash ] \
             && [ "$(cat out/app-ios/.cmake_inputs_hash)" = "$HASH" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CMake inputs unchanged; cached project is authoritative"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CMake inputs changed (or no stamp); configure will run"
          fi

      - name: Configure iOS
        if: ${{ inputs.force_configure || steps.cmake-inputs.outputs.changed == 'true' }}
        run: |
          cmake -S app -B out/app-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/ios_port/cmake/ios-arm64.cmake" \
            -DDS2_GENERATED_DIR="$GITHUB_WORKSPACE/$GENERATED_DIR" \
            -DREXGLUE_PLATFORM_IOS=ON \
            -DREXGLUE_IOS_MOLTENVK="$MOLTENVK_LIB" \
            -DCMAKE_BUILD_TYPE=Release \
            -DDS2_PGO=OFF \
            -DREXGLUE_ENABLE_PERF_COUNTERS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/ios_port/include -I$MOLTENVK_INCLUDE" \
            -DCMAKE_EXE_LINKER_FLAGS="-framework IOSurface" \
            -DCMAKE_XCODE_ATTRIBUTE_CC=clang -DCMAKE_XCODE_ATTRIBUTE_CXX=clang++
          # Plain clang only: CMAKE_XCODE_ATTRIBUTE_CC="ccache clang" makes
          # Xcode try to spawn a binary literally named 'ccache clang', which
          # never exists -> every thirdparty target fails to compile. ccache
          # never provided hits here anyway (tiny cold cache, stats zeroed).
          # A stale CMakeCache.txt cannot resurrect ccache: the explicit -D
          # always overrides cached values.
          echo "$CMAKE_INPUTS_HASH" > out/app-ios/.cmake_inputs_hash

      - name: Use cached Xcode project (skip 3-minute reconfigure)
        if: ${{ !inputs.force_configure && steps.cmake-inputs.outputs.changed != 'true' }}
        run: |
          # ZERO_CHECK regenerates the project when any CMakeLists.txt is newer
          # than the generated files. A fresh checkout makes them all newer,
          # so pin their timestamps; only the Xcode project (restored above)
          # is authoritative. C++ sources keep their real mtimes, so Xcode
          # still recompiles exactly the files we edit.
          find . -type f \( -name 'CMakeLists.txt' -o -name '*.cmake' \) \
            -not -path './out/*' -exec touch -t 202001010000 {} +
          test -f out/app-ios/ds2.xcodeproj/project.pbxproj
          test -f out/app-ios/.cmake_inputs_hash
          echo "Xcode project restored from cache; configure skipped"

      # GitHub checkout refreshes every file's mtime, and the generated-code
      # artifact is extracted fresh too, so Xcode would rebuild ALL ~340 TUs
      # every run. Reset every source mtime to the HEAD commit time, then give
      # the files actually changed by that commit a current time: Xcode now
      # rebuilds only the changed translation units.
      - name: Normalize source mtimes for incremental Xcode builds
        run: |
          # A fixed ancient timestamp: sources must look OLDER than the cached
          # build products. BSD touch (macOS) has no -d; use portable -t.
          find app sdk ios_port app/generated -type f \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \
               -o -name '*.m' -o -name '*.c' -o -name '*.cmake' \
               -o -name 'CMakeLists.txt' \) -print0 \
            | xargs -0 touch -t 202001010000 || true
          git diff-tree --no-commit-id --name-only -r HEAD | while read -r f; do
            [ -f "$f" ] && touch "$f"
          done
          echo "mtimes normalized to commit time $CT"

      - name: Build Mach-O
        run: |
          echo "--- ccache diag ---"
          ccache -p 2>/dev/null | grep -i cache_dir || echo "no ccache config"
          du -sh ~/Library/Caches/ccache 2>/dev/null || echo "cache dir empty/missing"
          grep -c ccache out/app-ios/*.xcodeproj/project.pbxproj 2>/dev/null || echo "ccache NOT in pbxproj"
          ccache -z 2>/dev/null || true
          JOBS="$(sysctl -n hw.ncpu)"
          cmake --build out/app-ios --config Release --target ds2 -- -jobs "$JOBS"
          echo "--- ccache stats after build ---"
          ccache -s 2>/dev/null | head -8 || true
          du -sh ~/Library/Caches/ccache 2>/dev/null || true

      # The Xcode generator honours RUNTIME_OUTPUT_DIRECTORY ($<TARGET_FILE_DIR:
      # rex::runtime>), so the binary lands in sdk/out/ios-arm64/Release, NOT
      # under out/app-ios/. Stage it at a single known path for the packer.
      - name: Stage Mach-O for packaging
        run: |
          EXE="$(find "$GITHUB_WORKSPACE" -type f -name ds2 -perm -111 \
                  -not -path '*/.dSYM/*' | head -1)"
          test -n "$EXE" || { echo "Mach-O not found"; exit 1; }
          mkdir -p build/out
          cp "$EXE" build/out/ds2
          file build/out/ds2
          ls -la build/out/ds2

      - name: Upload Mach-O
        uses: actions/upload-artifact@v4
        with:
          name: ds2-macho
          path: build/out/ds2
          retention-days: 7
          if-no-files-found: error

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-v1-${{ github.run_id }}

      - name: Save iOS Xcode project and objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out/app-ios
          key: ds2-ios-tree-v2-${{ github.run_id }}

  # ------------------------------------------------------------------ package
  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Mach-O
        uses: actions/download-artifact@v4
        with:
          name: ds2-macho
          path: build/in

      - name: Locate executable
        run: |
          EXE="$(find build/in -name ds2 -type f | head -1)"
          test -n "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - name: Build .ipa with our own packer (no Xcode here)
        # The 501 MiB shader pack is NOT bundled: it is copied to the phone's
        # Documents via Files together with game_root/. The patched
        # ResolveShaderLibrary() looks for it there. This keeps the .ipa small
        # and avoids a slow 501 MB upload to GitHub on every run.
        run: |
          # OnConfigurePaths() looks for "ds2.toml" in the .app bundle, so the
          # optimized config must carry that exact name inside the .ipa.
          cp ios_port/out/ds2_ios.toml ds2.toml
          python3 ios_port/tools/mkipa.py \
            --executable "$EXE" \
            --plist ios_port/Info.plist \
            --resource ds2.toml \
            --out ds2-ios.ipa \
            --bundle-id com.yourteam.ds2ios
          python3 ios_port/tools/mkipa.py --verify ds2-ios.ipa

      - name: Sign with the developer's own certificate
        if: ${{ inputs.do_sign }}
        env:
          P12: ${{ secrets.P12_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          MP: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          echo "$P12" | base64 -d > /tmp/cert.p12
          echo "$MP" | base64 -d > /tmp/profile.mobileprovision
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign && mkdir build && cd build && cmake .. && make -j4
          sudo cp zsign /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          zsign -k /tmp/cert.p12 -p "$P12_PASS" -m /tmp/profile.mobileprovision \
                -o ds2-ios-signed.ipa ds2-ios.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ds2-ios-ipa
          path: |
            ds2-ios.ipa
            ds2-ios-signed.ipa
          if-no-files-found: ignore
          retention-days: 7

      # Publish the fresh .ipa into the rolling "ds2-ios-latest" release so it
      # can be downloaded straight from GitHub on the phone (GBox / Safari).
      - name: Publish .ipa to ds2-ios-latest release (versioned name)
        if: ${{ hashFiles('ds2-ios.ipa') != '' }}
        run: |
          VER="$(date -u +'%Y.%m.%d.%H%M')"
          echo "IPA_VER=$VER" >> "$GITHUB_ENV"
          cp ds2-ios.ipa "ds2-ios-$VER.ipa"
          # drop the previous versioned asset so only the freshest one remains
          gh release view ds2-ios-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep '^ds2-ios-2' | while read -r a; do
              gh release delete-asset ds2-ios-latest "$a" --repo "$GITHUB_REPOSITORY" -y || true
            done
          gh release upload ds2-ios-latest "ds2-ios-$VER.ipa" ds2-ios.ipa \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/ds2-ios-latest/ds2-ios-$VER.ipa"
        env:
          GH_TOKEN: ${{ github.token }}

      # GBox reads sourceUpdateTime to decide whether to re-parse the app list,
      # so bump version + timestamp on every build and commit it back.
      - name: Refresh GBox source (ds2.appsrc)
        if: ${{ hashFiles('ds2-ios.ipa') != '' }}
        run: |
          VER="${IPA_VER:-$(date -u +'%Y.%m.%d.%H%M')}"
          STAMP="$(date -u +'%Y-%m-%dT%H:%M:%S+0000')"
          PKG_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/ds2-ios-latest/ds2-ios-$VER.ipa"
          python3 - "$VER" "$STAMP" "$PKG_URL" <<'PY'
          import json, sys
          ver, stamp, pkg = sys.argv[1], sys.argv[2], sys.argv[3]
          p = 'gbox/ds2.appsrc'
          src = json.load(open(p, encoding='utf-8'))
          src['sourceUpdateTime'] = stamp
          for app in src['appRepositories']:
              if app.get('appType') != 'LINK':
                  app['appUpdateTime'] = stamp
                  app['appVersion'] = ver
                  app['appPackage'] = pkg
          json.dump(src, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=4)
          print('gbox source ->', ver, pkg)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet gbox/ds2.appsrc; then
            git add gbox/ds2.appsrc
            git commit -m "gbox: bump source to $VER [skip ci]"
            git push
          fi
          # The source itself rides on the release too: release assets are not
          # CDN-cached, so GBox always sees the fresh list at a stable URL.
          gh release upload ds2-ios-latest gbox/ds2.appsrc --repo "$GITHUB_REPOSITORY" --clobber

